<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Acerte a Palavra</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="game">
      <h1>Acerte a Palavra</h1>
      <p class="subtitle">5 letras • 5 chances</p>

      <div id="board" class="board" aria-label="Tabuleiro do jogo"></div>

      <div class="controls">
        <button id="submitBtn" class="action">Enviar</button>
        <button id="deleteBtn" class="action secondary">Apagar</button>
      </div>

      <div id="playAgainWrap" class="play-again-wrap" hidden>
        <button id="playAgainBtn" class="action">Jogar novamente</button>
      </div>

      <p id="message" class="message" aria-live="polite"></p>
    </main>

    <script src="script.js"></script>
  </body>
</html>
